<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Reports - MyEnglish</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 600px;
            width: 100%;
        }
        
        h1 {
            color: #333;
            text-align: center;
            margin-bottom: 10px;
            font-size: 32px;
        }
        
        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 40px;
            font-size: 16px;
        }
        
        .reports {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        
        .report-card {
            background: white;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            padding: 20px;
            transition: all 0.3s ease;
            cursor: pointer;
            text-decoration: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 150px;
        }
        
        .report-card:hover {
            border-color: #667eea;
            background: #f8f9ff;
            transform: translateY(-4px);
            box-shadow: 0 8px 16px rgba(102, 126, 234, 0.2);
        }
        
        .report-icon {
            font-size: 40px;
            margin-bottom: 12px;
        }
        
        .report-title {
            color: #333;
            font-weight: 600;
            font-size: 18px;
            text-align: center;
            margin-bottom: 6px;
        }
        
        .report-desc {
            color: #999;
            font-size: 13px;
            text-align: center;
        }
        
        @media (max-width: 600px) {
            .reports {
                grid-template-columns: 1fr;
            }
            
            .container {
                padding: 20px;
            }
            
            h1 {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📊 Test Reports</h1>
        <p class="subtitle">MyEnglish Repository Test & Coverage Results</p>
        
        <div class="reports">
            <a href="./report.html" class="report-card">
                <div class="report-icon">📝</div>
                <div class="report-title">Test Report</div>
                <div class="report-desc">Pytest Results</div>
            </a>
            
            <a href="./htmlcov/index.html" class="report-card">
                <div class="report-icon">📈</div>
                <div class="report-title">Coverage Report</div>
                <div class="report-desc">Code Coverage Details</div>
            </a>
        </div>
    </div>
</body>
</html>
