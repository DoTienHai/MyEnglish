<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Reports - MyEnglish</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 1000px;
            width: 100%;
        }
        
        h1 {
            color: #333;
            text-align: center;
            margin-bottom: 10px;
            font-size: 32px;
        }
        
        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 16px;
        }
        
        .test-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        
        .test-table thead {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        
        .test-table th {
            color: white;
            padding: 16px;
            text-align: left;
            font-weight: 600;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border: none;
        }
        
        .test-table tbody tr {
            border-bottom: 1px solid #e0e0e0;
            transition: background-color 0.2s ease;
        }
        
        .test-table tbody tr:hover {
            background-color: #f8f9ff;
        }
        
        .test-table td {
            padding: 14px 16px;
            color: #333;
            font-size: 14px;
        }
        
        .test-type {
            font-weight: 600;
            color: #667eea;
        }
        
        .test-object {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 500;
        }
        
        .test-object-icon {
            font-size: 18px;
        }
        
        .report-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            border-radius: 6px;
            text-decoration: none;
            color: white;
            font-weight: 500;
            font-size: 13px;
            transition: all 0.2s ease;
            cursor: pointer;
            border: none;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        
        .report-link:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }
        
        .report-link-icon {
            font-size: 14px;
        }
        
        .stats-badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 600;
            margin-left: 6px;
        }
        
        .stats-badge.passed {
            background: #f0fdf4;
            color: #166534;
            border: 1px solid #86efac;
        }
        
        .stats-badge.coverage {
            background: #eff6ff;
            color: #1e40af;
            border: 1px solid #93c5fd;
        }

        .current-datetime {
            text-align: center;
            color: #999;
            font-size: 15px;
            margin-bottom: 20px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            font-weight: 600;
        }
        @media (max-width: 900px) {
            .container {
                padding: 20px;
            }
            
            .test-table th,
            .test-table td {
                padding: 10px 8px;
                font-size: 12px;
            }
            
            h1 {
                font-size: 24px;
            }
        }
        
        @media (max-width: 600px) {
            .container {
                padding: 15px;
                max-width: 100%;
            }
            
            h1 {
                font-size: 20px;
            }
            
            .test-table {
                font-size: 11px;
            }
            
            .test-table th,
            .test-table td {
                padding: 8px 6px;
            }
            
            .report-link {
                padding: 4px 8px;
                font-size: 11px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📊 Test Reports</h1>
        <p class="subtitle">MyEnglish Test Results & Coverage Overview</p>
        <p class="current-datetime" id="lastGeneratedTimeDisplay"></p>
        
        <table class="test-table">
            <thead>
                <tr>
                    <th>Loại Test</th>
                    <th>Object Test</th>
                    <th>Test Report</th>
                    <th>Coverage Report</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <!-- Test rows will be generated here -->
            </tbody>
        </table>
    </div>
    
    <script>
        // Check if file exists by trying to fetch it
        async function fileExists(path) {
            try {
                const response = await fetch(path, { method: 'HEAD' });
                return response.ok;
            } catch {
                return false;
            }
        }
        
        // Extract timestamp from test report HTML
        function extractReportTimestamp(html) {
            // Pattern: "Report generated on 22-Feb-2026 at 14:06:15"
            const reportMatch = html.match(/Report generated on (\d{2}-\w{3}-\d{4}) at (\d{2}:\d{2}:\d{2})/);
            if (reportMatch) {
                return {
                    date: reportMatch[1],  // "22-Feb-2026"
                    time: reportMatch[2],  // "14:06:15"
                    fullString: `${reportMatch[1]} ${reportMatch[2]}`
                };
            }
            return null;
        }
        
        // Extract timestamp from coverage HTML
        function extractCoverageTimestamp(html) {
            // Pattern: "created at 2026-02-22 14:06 +0700"
            const coverageMatch = html.match(/created at (\d{4}-\d{2}-\d{2}) (\d{2}:\d{2})/);
            if (coverageMatch) {
                return {
                    date: coverageMatch[1],  // "2026-02-22"
                    time: coverageMatch[2],  // "14:06"
                    fullString: `${coverageMatch[1]} ${coverageMatch[2]}`
                };
            }
            return null;
        }
        
        // Load configuration and generate table rows dynamically
        async function initializeReports() {
            try {
                const configResponse = await fetch('./tests-config.json');
                const config = await configResponse.json();
                
                const tableBody = document.getElementById('tableBody');
                tableBody.innerHTML = '';
                
                for (const reportType of config.testReportTypes) {
                    for (const group of reportType.groups) {
                        const row = await createTableRow(reportType, group);
                        tableBody.innerHTML += row;
                    }
                }
                
                // Load all stats after rendering
                loadAllTestSummaries(config.testReportTypes);
                
                // Load latest timestamp from test reports
                loadLatestTimestamp(config.testReportTypes);
                
            } catch (error) {
                console.log('Error initializing reports:', error);
            }
        }
        
        // Find and display the latest timestamp from all test reports
        async function loadLatestTimestamp(reportTypes) {
            let latestDate = null;
            let latestDateObj = new Date(0);
            
            for (const reportType of reportTypes) {
                for (const group of reportType.groups) {
                    const reportPath = `./${reportType.basePath}/${group.folder}/report.html`;
                    const coveragePath = `./${reportType.basePath}/${group.folder}/htmlcov/index.html`;
                    
                    // Try to get timestamp from report.html
                    try {
                        const reportResponse = await fetch(reportPath);
                        if (reportResponse.ok) {
                            const reportHtml = await reportResponse.text();
                            const timestamp = extractReportTimestamp(reportHtml);
                            if (timestamp) {
                                latestDate = timestamp;
                                // Parse date for comparison
                                const dateStr = convertToStandardDate(timestamp.fullString);
                                const dateObj = new Date(dateStr);
                                if (dateObj > latestDateObj) {
                                    latestDateObj = dateObj;
                                }
                            }
                        }
                    } catch (e) {
                        // Ignore errors, continue to next
                    }
                    
                    // Try to get timestamp from coverage HTML
                    try {
                        const coverageResponse = await fetch(coveragePath);
                        if (coverageResponse.ok) {
                            const coverageHtml = await coverageResponse.text();
                            const timestamp = extractCoverageTimestamp(coverageHtml);
                            if (timestamp) {
                                latestDate = timestamp;
                                // Parse date for comparison
                                const dateStr = timestamp.fullString;
                                const dateObj = new Date(dateStr);
                                if (dateObj > latestDateObj) {
                                    latestDateObj = dateObj;
                                }
                            }
                        }
                    } catch (e) {
                        // Ignore errors, continue to next
                    }
                }
            }
            
            // Display the latest timestamp
            const timestampEl = document.getElementById('lastGeneratedTimeDisplay');
            if (timestampEl) {
                if (latestDate) {
                    // Format: "22-Feb-2026 14:06:15" or "2026-02-22 14:06"
                    timestampEl.textContent = 'Last test run: ⏱️ ' + latestDate.fullString;
                } else {
                    timestampEl.textContent = '';
                }
            }
        }
        
        // Convert various date formats to standard format for comparison
        function convertToStandardDate(dateString) {
            // Handle "22-Feb-2026 14:06:15" format
            const match1 = dateString.match(/(\d{2})-(\w{3})-(\d{4}) (\d{2}:\d{2}:\d{2})/);
            if (match1) {
                const monthMap = {
                    'Jan': '01', 'Feb': '02', 'Mar': '03', 'Apr': '04', 'May': '05', 'Jun': '06',
                    'Jul': '07', 'Aug': '08', 'Sep': '09', 'Oct': '10', 'Nov': '11', 'Dec': '12'
                };
                return `${match1[3]}-${monthMap[match1[2]]}-${match1[1]}T${match1[4]}`;
            }
            
            // Handle "2026-02-22 14:06" format
            const match2 = dateString.match(/(\d{4})-(\d{2})-(\d{2}) (\d{2}:\d{2})/);
            if (match2) {
                return `${match2[1]}-${match2[2]}-${match2[3]}T${match2[4]}:00`;
            }
            
            return dateString;
        }
        
        async function createTableRow(reportType, group) {
            const folderId = `${reportType.basePath}_${group.folder}`.replace(/\s+/g, '_');
            
            return `
                <tr data-folder-id="${folderId}">
                    <td class="test-type">${reportType.icon} ${reportType.name}</td>
                    <td class="test-object">
                        <span class="test-object-icon">${group.icon}</span>
                        <span>${group.name}</span>
                    </td>
                    <td>
                        <a href="./${reportType.basePath}/${group.folder}/report.html" class="report-link" target="_blank">
                            <span class="report-link-icon">📝</span>
                            <span>View Report</span>
                            <span class="stats-badge passed" id="${folderId}_test_stats">-</span>
                        </a>
                    </td>
                    <td>
                        <a href="./${reportType.basePath}/${group.folder}/htmlcov/index.html" class="report-link" target="_blank">
                            <span class="report-link-icon">📈</span>
                            <span>Coverage</span>
                            <span class="stats-badge coverage" id="${folderId}_coverage_stats">-</span>
                        </a>
                    </td>
                </tr>
            `;
        }
        
        async function loadAllTestSummaries(reportTypes) {
            for (const reportType of reportTypes) {
                for (const group of reportType.groups) {
                    await loadTestSummary(group, reportType.basePath);
                }
            }
        }
        
        async function loadTestSummary(group, basePath) {
            try {
                const reportPath = `./${basePath}/${group.folder}/report.html`;
                const coveragePath = `./${basePath}/${group.folder}/htmlcov/index.html`;
                const folderId = `${basePath}_${group.folder}`.replace(/\s+/g, '_');
                const rowElement = document.querySelector(`tr[data-folder-id="${folderId}"]`);
                
                // Step 1: Check if folder exists by trying to fetch htmlcov/index.html
                const folderExists = await fileExists(coveragePath);
                
                if (!folderExists) {
                    // Folder không tồn tại (404) → Ẩn row
                    if (rowElement) {
                        rowElement.style.display = 'none';
                    }
                    return;
                }
                
                // Folder tồn tại → Giữ row, tiếp tục check reports
                
                // Step 2: Check if report.html exists
                const reportExists = await fileExists(reportPath);
                const testStatsEl = document.getElementById(`${folderId}_test_stats`);
                
                if (!reportExists) {
                    // report.html chưa có → Not Tested
                    if (testStatsEl) {
                        testStatsEl.textContent = '⏳ Not Tested';
                    }
                } else {
                    // report.html có → Parse và hiển thị % thực tế
                    try {
                        const reportResponse = await fetch(reportPath);
                        const reportHtml = await reportResponse.text();
                        const stats = parseTestReport(reportHtml);
                        const passedPercent = stats.total > 0 ? Math.round((stats.passed / stats.total) * 100) : 0;
                        
                        if (testStatsEl) {
                            testStatsEl.textContent = `${passedPercent}%`;
                        }
                    } catch (e) {
                        if (testStatsEl) {
                            testStatsEl.textContent = '⏳ Not Tested';
                        }
                    }
                }
                
                // Step 3: Check if htmlcov/index.html exists
                const coverageStatsEl = document.getElementById(`${folderId}_coverage_stats`);
                
                if (!folderExists) {
                    // htmlcov chưa có → Not Tested
                    if (coverageStatsEl) {
                        coverageStatsEl.textContent = '⏳ Not Tested';
                    }
                } else {
                    // htmlcov có → Parse và hiển thị % thực tế
                    try {
                        const coverage = await loadCoverage(coveragePath);
                        if (coverageStatsEl) {
                            coverageStatsEl.textContent = `${coverage}%`;
                        }
                    } catch (e) {
                        if (coverageStatsEl) {
                            coverageStatsEl.textContent = '⏳ Not Tested';
                        }
                    }
                }
                
            } catch (error) {
                console.log(`Could not load test summary for ${group.name}:`, error);
            }
        }
        
        function updateTestStats(folderId, stats, coverage) {
            const passedPercent = stats.total > 0 ? Math.round((stats.passed / stats.total) * 100) : 0;
            
            const testStatsEl = document.getElementById(`${folderId}_test_stats`);
            if (testStatsEl) {
                testStatsEl.textContent = `${passedPercent}%`;
            }
            
            const coverageStatsEl = document.getElementById(`${folderId}_coverage_stats`);
            if (coverageStatsEl) {
                coverageStatsEl.textContent = `${coverage}%`;
            }
        }
        
        function parseTestReport(html) {
            const stats = { total: 0, passed: 0, failed: 0 };
            
            // Match pattern from pytest-html: <span class="passed">81 Passed,</span>
            const passMatch = html.match(/<span\s+class=["']?passed["']?[^>]*>(\d+)\s+Passed/i);
            if (passMatch) {
                stats.passed = parseInt(passMatch[1]) || 0;
            }
            
            // Match pattern from pytest-html: <span class="failed">0 Failed,</span>
            const failMatch = html.match(/<span\s+class=["']?failed["']?[^>]*>(\d+)\s+Failed/i);
            if (failMatch) {
                stats.failed = parseInt(failMatch[1]) || 0;
            }
            
            stats.total = stats.passed + stats.failed;
            
            return stats;
        }
        
        async function loadCoverage(htmlPath) {
            try {
                const response = await fetch(htmlPath);
                const html = await response.text();
                
                // Parse coverage percentage from HTML
                // Coverage.py uses: <span class="pc_cov">93%</span>
                const percentMatch = html.match(/<span\s+class=["']?pc_cov["']?[^>]*>(\d+(?:\.\d+)?)\s*%<\/span>/i);
                
                if (percentMatch) {
                    return Math.round(parseFloat(percentMatch[1]));
                }
                
                return 0;
            } catch (error) {
                console.log('Could not load coverage from ' + htmlPath, error);
                return 0;
            }
        }
        
        // Initialize reports when page loads
        initializeReports();
    </script>
</body>
